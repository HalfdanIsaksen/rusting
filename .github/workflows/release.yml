name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build the
# app for macOS, Windows and Linux, publish a GitHub Release, and update the
# Homebrew formula in Formula/rusting.rb. The release text comes from
# release-notes.md, which is reset afterwards. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check release notes are written
        run: scripts/check-release-notes.sh

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # One binary for Apple Silicon and Intel, merged with lipo.
          - { target: universal-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux windowing deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "universal-apple-darwin" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --locked -p desktop --target aarch64-apple-darwin
            cargo build --release --locked -p desktop --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/rusting \
              target/aarch64-apple-darwin/release/rusting \
              target/x86_64-apple-darwin/release/rusting
          else
            rustup target add "${{ matrix.target }}"
            cargo build --release --locked -p desktop --target "${{ matrix.target }}"
          fi
      - name: Package
        shell: bash
        run: |
          name="rusting-${VERSION}-${{ matrix.target }}"
          mkdir -p dist stage
          cp LICENSE README.md stage/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/rusting.exe" stage/
            (cd stage && 7z a "../dist/${name}.zip" .)
          else
            cp "target/${{ matrix.target }}/release/rusting" stage/
            tar -czf "dist/${name}.tar.gz" -C stage .
          fi
      # macOS only: a signed, notarized Rusting.app in a DMG (ADR-014). The
      # tarball above stays unsigned for the Homebrew formula. The secrets
      # are described in docs/releasing.md.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12" || -z "$MACOS_CERT_PASSWORD" ]]; then
            echo "The MACOS_CERT_P12 and MACOS_CERT_PASSWORD secrets are not set (see docs/releasing.md)" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build, sign and notarize the DMG
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
          scripts/macos-dmg.sh "$VERSION"
          rm "$NOTARY_KEY_PATH"
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release and Homebrew formula
    needs: [check-version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub Release
        run: |
          scripts/clean-release-notes.sh > "${RUNNER_TEMP}/notes.md"
          gh release create "v${VERSION}" dist/* --verify-tag --notes-file "${RUNNER_TEMP}/notes.md" --generate-notes --title "Rusting ${VERSION}"
      - name: Update Homebrew formula
        run: |
          sha="$(sha256sum "dist/rusting-${VERSION}-universal-apple-darwin.tar.gz" | cut -d' ' -f1)"
          scripts/homebrew-formula.sh "${VERSION}" "${sha}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/release-notes-template.md release-notes.md
          git add Formula/rusting.rb release-notes.md
          git commit -m "Homebrew: rusting ${VERSION}, reset release notes [skip ci]"
          git push origin HEAD:main
