[package]
name = "desktop"
description = "Rusting desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rusting"
path = "src/main.rs"

[dependencies]
document.workspace = true
editor.workspace = true
export.workspace = true
renderer.workspace = true
ui.workspace = true
winit.workspace = true
# egui 0.37 has no default features; bundle its fonts (and the emoji/icon fonts
# the panels use for tool and playback symbols) so text renders.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu.workspace = true
egui-winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rodio.workspace = true
serde.workspace = true
serde_json.workspace = true
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
ureq = "3.5.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Dock icon (bare binary, no .app bundle): versions already used by rfd and egui-winit.
objc2 = "0.6"
# Tablet pen pressure (ADR-025): an NSEvent monitor, with block2 for its handler.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSEvent", "NSImage", "NSResponder"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }
png = "0.18"

[lints]
workspace = true
